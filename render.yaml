databases:
  - name: greenwood-collegium-db
    postgresMajorVersion: "18"
    region: oregon
    plan: basic-256mb

services:
  - type: web
    name: greenwood-collegium
    runtime: node
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /health/live
    maxShutdownDelaySeconds: 30
    buildCommand: corepack enable && corepack prepare pnpm@11.25.0 --activate && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm --filter @greenwood/server start
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CLASSROOM_MODE
        value: "true"
      - key: PUBLIC_REGISTRATION
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: WORLD_VERSION
        value: "0.0.0"
      - key: RAW_COMMAND_RETENTION_DAYS
        value: "14"
      - key: CHAT_RETENTION_DAYS
        value: "30"
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,https://greenwood-collegium.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: greenwood-collegium-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_TOKEN
        generateValue: true
