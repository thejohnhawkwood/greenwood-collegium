name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: greenwood
          POSTGRES_PASSWORD: greenwood
          POSTGRES_DB: greenwood_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greenwood -d greenwood_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GREENWOOD_TEST_DATABASE_URL: postgres://greenwood:greenwood@localhost:5432/greenwood_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Require Node 24
        run: |
          node --eval "const major = Number(process.versions.node.split('.')[0]); if (major !== 24) { console.error('CI expected Node 24, got ' + process.versions.node); process.exit(1); } console.log('Node ' + process.versions.node);"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
