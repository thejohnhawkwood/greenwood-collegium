name: Student Contribution
description: A bounded classroom task for a student contributor.
title: "[Student] "
labels: ["student-contribution"]
body:
  - type: dropdown
    id: level
    attributes:
      label: Suggested level
      options:
        - Grade 9 observation or writing
        - Introductory programming
        - Intermediate programming
        - Advanced programming
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What file, command, room, or test should change?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
    validations:
      required: true
