name: Accessibility
description: Keyboard, contrast, motion, screen reader, or readability issue.
title: "[A11y] "
labels: ["accessibility"]
body:
  - type: textarea
    id: barrier
    attributes:
      label: Barrier
      description: What could a player not do, or not understand?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Keyboard and focus
        - Colour and contrast
        - Motion
        - Screen reader
        - Readability
        - Other
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed fix
