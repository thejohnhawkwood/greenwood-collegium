name: Refactor
description: Improve structure without changing intended behaviour.
title: "[Refactor] "
labels: ["refactor"]
body:
  - type: textarea
    id: reason
    attributes:
      label: Why now
      description: What concrete problem does this refactor solve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: How we know behaviour is unchanged
    validations:
      required: true
