name: Bug
description: Something does not work as the PRD or a test says it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: What did you see? Include a command transcript if possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: markdown
    attributes:
      value: Do not paste secrets, student names, or production logs.
